<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sistema de Produtividade — 2ª Vara Cível</title>
    <!--
      08/11/2026: o sistema legado que ficava aqui (outro projeto Firebase, senhas no código,
      PWA com escopo "/") foi retirado do ar. Esta página só redireciona para o sistema em uso,
      em ./2vara-civel/, e desinstala o service worker antigo do escopo da raiz.
    -->
    <meta http-equiv="refresh" content="3;url=./2vara-civel/">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f7f8; color: #17272e; }
        main { max-width: 32rem; padding: 1.5rem; text-align: center; }
        a { color: #0e7490; }
        @media (prefers-color-scheme: dark) { body { background: #0f1b20; color: #e6eef0; } a { color: #67e8f9; } }
    </style>
</head>
<body>
    <main>
        <p>O sistema mudou de endereço.</p>
        <p><a href="./2vara-civel/">Abrir o sistema da 2ª Vara Cível</a></p>
    </main>
    <script>
        (function () {
            var destino = new URL('./2vara-civel/', location.href).href;
            var escopoRaiz = new URL('./', location.href).href;
            function seguir() { location.replace(destino); }
            // desregistra só o service worker do escopo da raiz (o da 2ª Vara, em /2vara-civel/, fica)
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                var limite = setTimeout(seguir, 1500);
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.filter(function (r) { return r.scope === escopoRaiz; })
                        .map(function (r) { return r.unregister(); }));
                }).catch(function () {}).then(function () { clearTimeout(limite); seguir(); });
            } else {
                seguir();
            }
        })();
    </script>
</body>
</html>
